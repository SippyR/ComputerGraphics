    let {cubeVertices, cubeEdges} = createCube({x:(Math.floor(Math.random()*11)), y: (Math.floor(Math.random()*11)), z:10});

  function moveHazard(){

  }
  function drawAllObjects(hazardLs, camera) {
    //here we set up and clear the canvas, every draw frame
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#050510";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let obj of hazardLs) {
      draw(obj.vertices, obj.edges, camera);
    }
    drawStaticObjects();
  }

  function draw(vertices, edges, camera) {


    // here we will store u,v coordinates for the vertices, 
    // projected onto our 2d plane
    let projectedVertices = [];

    //- loop through the original vertices (X, Y, Z)
    //- and determine their position in 3D space relative to camera (x, y, z)
    //- then project them onto the 2D plane
    for(let v = 0; v< vertices.length; v++){   //  you could also write it foreach...
       //console.log("original position:");  //helpful to print things
       //console.log( vertices[v] );

       //console.log("camera-relative position");
       let camVert = {}; 
       camVert.x = vertices[v].x - camera.x; //**** TO DO
       camVert.y = vertices[v].y - camera.y; //**** TO DO
       camVert.z = vertices[v].z - camera.z; //**** TO DO
       //console.log( camVert );

       //console.log("projected position"); 
       let canvasPos = {};
       canvasPos.u = camVert.x / camVert.z; //**** TO DO  
       canvasPos.v = camVert.y / camVert.z; //**** TO DO 
       //console.log( canvasPos );

       //console.log("scale and center"); 
       canvasPos.u = canvasPos.u * canvas.width + canvas.width/2;
       canvasPos.v = canvasPos.v * canvas.height + canvas.height/2;
       //console.log( canvasPos );

       projectedVertices.push(canvasPos);
       //console.log("---------------"); 

    }

    //loop through the edges
    //  find the newly computed projected vertices - 2 per edge
    //  draw the line
    for(let e = 0; e < edges.length; e++){
      
      //first vertex
      let e1 = edges[e][0]; //idx
      let u1 = projectedVertices[ e1 ].u; 
      let v1 = canvas.height - projectedVertices[ e1 ].v;  //TO DO- explain why did I do this? 
      // Because the canvas coordinate system has the origin(0,0) at the top-left corner

      //second vertex
      let e2 = edges[e][1]; //idx
      let u2 = projectedVertices[ e2 ].u;
      let v2 = canvas.height - projectedVertices[ e2 ].v;  //TO DO- explain why did I do this?

      drawLine(u1, v1, u2, v2);
    }



  }

  function drawStaticObjects() {
    // Draw the static ship frame with direct canvas coordinates
    drawLine(1.5*canvas.width/4, 2*canvas.height/4, 2.5*canvas.width/4, 2*canvas.height/4); // Top edge
    drawLine(1.5*canvas.width/4, 2*canvas.height/4, 1.5*canvas.width/4, 3*canvas.height/4); // Left edge
    drawLine(2.5*canvas.width/4, 2*canvas.height/4, 2.5*canvas.width/4, 3*canvas.height/4); // Right edge
    drawLine(1.5*canvas.width/4, 3*canvas.height/4, 2.5*canvas.width/4, 3*canvas.height/4); // Bottom edge

    drawLine(0, 1.5*canvas.height/4, 1.5*canvas.width/4, 2*canvas.height/4); // Top Left diagonal to left edge
    drawLine(canvas.width, 1.5*canvas.height/4, 2.5*canvas.width/4, 2*canvas.height/4); // Top Right diagonal to right edge
    drawLine(1.5*canvas.width/4, 3*canvas.height/4, 0, 3.5*canvas.height/4); // Bottom Left diagonal to left edge
    drawLine(2.5*canvas.width/4, 3*canvas.height/4, canvas.width, 3.5*canvas.height/4); // Bottom Right diagonal to right edge

    // Create the target square in the center of the ship frame
    drawLine(1.9*canvas.width/4, 2.6*canvas.height/4, 2.1*canvas.width/4, 2.6*canvas.height/4); // Top edge of target square
    drawLine(1.9*canvas.width/4, 2.6*canvas.height/4, 1.9*canvas.width/4, 2.4*canvas.height/4); // Left edge of target square
    drawLine(2.1*canvas.width/4, 2.4*canvas.height/4, 2.1*canvas.width/4, 2.6*canvas.height/4); // Right edge of target square
    drawLine(1.9*canvas.width/4, 2.4*canvas.height/4, 2.1*canvas.width/4, 2.4*canvas.height/4); // Bottom edge of target square
  }

  //This uses a built in 'drawLine' function, provided by the javascript canvas
  function drawLine(x1, y1, x2, y2){
    ctx.lineWidth = 2;
    ctx.strokeStyle = "white";

    //this is how you draw a line on the canvas 
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

        default:

      }
    });

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    drawAllObjects(hazardLs, camera);
  }

  function createCube(origin) {

    let cubeVertices = [ 
    { x:  1,  y: 1,  z: 1},   // A, idx 0
    { x: -1,  y: 1,  z: 1},   // B, idx 1
    { x:  1,  y: -1, z: 1},   // C, idx 2
    { x: -1,  y: -1, z:  1},  // D, idx 3
    { x:  1,  y: 1,  z: -1},  // E, idx 4
    { x: -1,  y: 1,  z: -1},  // F, idx 5
    { x:  1,  y: -1, z:  -1}, // G, idx 6
    { x: -1,  y: -1, z: -1}   // H, idx 7
  ];

  // an array of the indics for the two vertices in each edge
  let cubeEdges = [
    [0, 1], //AB
    [0, 2], //AC
    [0, 4], //AE
    [2, 3], //CD
    [1, 3], //BD
    [2, 6], //CG
    [4, 5], //EF
    [4, 6], //EG
    [1, 5], //BF
    [6, 7], //GH
    [5, 7], //FH
    [3, 7], //DH
  ];

  for (let i = 0; i < cubeVertices.length; i++) {
    cubeVertices[i].x += origin.x;
    cubeVertices[i].y += origin.y;
    cubeVertices[i].z += origin.z;
  }

  return {cubeVertices, cubeEdges};
  }

  function isObjectTargeted(object, camera) {
    // Check if the object is within the target square in the center of the ship frame
    // Determine the center of the object in 3D space
    let center = { x: 0, y: 0, z: 0 };
    for (let vertex of object.vertices) {
      center.x += vertex.x;
      center.y += vertex.y;
      center.z += vertex.z;
    }
    center.x /= object.vertices.length;
    center.y /= object.vertices.length;
    center.z /= object.vertices.length;

    // Determine the position of the center relative to the camera
    let camCoords = {
      x: center.x - camera.x,
      y: center.y - camera.y,
      z: center.z - camera.z
    };

    // Project the center onto the 2D plane
    let projected = {
      u: camCoords.x / camCoords.z,
      v: camCoords.y / camCoords.z
    };

    // Scale and center the projected coordinates
    projected.u = projected.u * canvas.width + canvas.width / 2;
    projected.v = projected.v * canvas.height + canvas.height / 2;
    projected.v = canvas.height - projected.v; // Invert v for canvas coordinates

    console.log("Projected coordinates of object center:", projected);
    // Check if the projected coordinates are within the target square
    let targetLeft = 1.9 * canvas.width / 4;
    let targetRight = 2.1 * canvas.width / 4;
    let targetTop = 2.6 * canvas.height / 4;
    let targetBottom = 2.4 * canvas.height / 4;

    console.log("Target square boundaries:", {
      left: targetLeft,
      right: targetRight,
      top: targetTop,
      bottom: targetBottom
    });

    return projected.u >= targetLeft && projected.u <= targetRight &&
           projected.v <= targetTop && projected.v >= targetBottom;

  }

  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
