<body>
  <canvas id="canvas"></canvas>

  </div>

<script>

  //we add shapes (like lines) to this canvas
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

 /* let objects = [
    { vertices: cubeVertices, edges: cubeEdges },

  let score = 0;
  let mode = "rasterized"// or "wireframe"
  const rows = 200;
  const cols = 320;
  let pixelGrid = Array.from({ length: cols }, () => Array(rows).fill("#050510"));

  let seePixelOutline = false; 

  function clearPixelGrid() {
    pixelGrid = Array.from({ length: cols }, () => Array(rows).fill("#050510"));
  }



  function setPixelColor(u,v,color){
    u = Math.round(u);
    v = Math.round(v);

    if (u >= 0 && u < cols && v >= 0 && v < rows) {
      pixelGrid[u][v] = color; 
    }
    // console.log("setPixelColor", u, v, color);
  }

  function makePixelatedLine(u1, v1, u2, v2, color){
    //console.log("makePixelatedLine", u1, v1, u2, v2, color);

    let dx = u2 - u1;
    let dy = v2 - v1;
    
    // Find whether the line is longer horizontally or vertically
    let steps = Math.max(Math.abs(dx), Math.abs(dy));

    // Calculate how much to move in u and v each step
    let xInc = dx / steps;
    let yInc = dy / steps;

    let x = u1;
    let y = v1;

    // Draw the pixels smoothly across the longest axis
    for (let i = 0; i <= steps; i++) {
      setPixelColor(x, y, color);
      x += xInc;
      y += yInc;
    }

  }
  let gameOver=false;
  let camera = {x: 0, y: 0, z: -10};
  let hazardLs= [];
  let moveCount=0;
  //include function to create multiple hazards

  let stars = [];
  // Create stars in the background
  for (let i = 0; i < 50; i++) {
    stars.push({
      x: Math.random() * cols,
      y: Math.random() * rows
    });
  }



  function createHazard(){
    if(Math.random() < 0.5){
      let {vertices, edges, faces} = createDiamond({x:(Math.floor(Math.random()*11)-5), y: (Math.floor(Math.random()*11)-5), z:11});
      hazardLs.push({vertices: vertices, edges: edges, faces: faces});
    }
    else{
      let {cubeVertices, cubeEdges, cubeFaces} = createCube({x:(Math.floor(Math.random()*11)-5), y: (Math.floor(Math.random()*11)-5), z:11});
      hazardLs.push({vertices: cubeVertices, edges: cubeEdges, faces: cubeFaces});
    }
    
  }

  function moveHazard(){
    for(let obj of hazardLs){
      obj.vertices = obj.vertices.map(v=> ({x:v.x,y:v.y,z:v.z-1}));
    }
  }
  function drawAllObjects(hazardLs, camera) {
    //here we set up and clear the canvas, every draw frame
    if(moveCount%5===0){
      createHazard();
    }
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#050510";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    clearPixelGrid();

    // Sort the entire hazard list from furthest to closest
    hazardLs.sort((a, b) => {
      let avgZA = a.vertices.reduce((sum, v) => sum + v.z, 0) / a.vertices.length;
      let avgZB = b.vertices.reduce((sum, v) => sum + v.z, 0) / b.vertices.length;
      
      return avgZB - avgZA; 
    });

    // Draw each hazard object
    for (let obj of hazardLs) {
      if(obj.vertices.some(v => v.z <= camera.z)) {
        // Remove the object if it is behind the camera
        console.log(gameOver);
        gameOver=true;
        hazardLs.splice(hazardLs.indexOf(obj), 1);
        continue; // Skip drawing this object
      }
      draw(obj.vertices, obj.edges, obj.faces, camera);
    }
    // Draw the stars
    for (let star of stars) {
      setPixelColor(star.x, star.y, "#FFFFFF");
    }
    drawStaticObjects();
    // Draw the Pixel Grid
    for(v=0; v< 200; v++){
      for(u=0; u<320; u++){

        //if you want to see what is going on
        // console.log(u);
        // console.log(v);
        // console.log(pixelGrid[u][v]);
        // console.log("----")

        ctx.fillStyle = pixelGrid[u][v];
        ctx.fillRect(u*5, v*5, 5, 5);

        if( seePixelOutline ){
          ctx.lineWidth = 1;
          ctx.strokeStyle = "#444444";
          ctx.strokeRect(u*5, v*5, 5, 5);
        }

      }
    }

    
    
    
  }

  function draw(vertices, edges, faces, camera) {

    // here we will store u,v coordinates for the vertices, 
    // projected onto our 2d plane
    let projectedVertices = [];

    //- loop through the original vertices (X, Y, Z)
    //- and determine their position in 3D space relative to camera (x, y, z)
    //- then project them onto the 2D plane
    for(let v = 0; v< vertices.length; v++){   //  you could also write it foreach...
       //console.log("original position:");  //helpful to print things
       //console.log( vertices[v] );

       //console.log("camera-relative position");
       let camVert = {}; 
       camVert.x = vertices[v].x - camera.x; 
       camVert.y = vertices[v].y - camera.y; 
       camVert.z = vertices[v].z - camera.z; 
       //console.log( camVert );

       //console.log("projected position"); 
       let canvasPos = {};
       canvasPos.u = camVert.x / camVert.z; 
       canvasPos.v = camVert.y / camVert.z; 
       canvasPos.z = camVert.z;  
       //console.log( canvasPos );

       //console.log("scale and center"); 
       canvasPos.u = canvasPos.u * cols + cols/2;
       canvasPos.v = canvasPos.v * rows + rows/2;
       //console.log( canvasPos );

       projectedVertices.push(canvasPos);
       //console.log("---------------"); 

    }

    //loop through the edges
    //  find the newly computed projected vertices - 2 per edge
    //  draw the line

    if(mode === "rasterized"){
      let sortedFaces = faces.slice().sort((a, b) => calcDepthDiff([a, b], projectedVertices));
      for(let e = 0; e < sortedFaces.length; e++){
        let faceIndices = sortedFaces[e].indices;
        for(let i=0; i<=2;i++){
          let e1 = faceIndices[i]; //idx
          let u1 = projectedVertices[ e1 ].u; 
          let v1 = rows - projectedVertices[ e1 ].v;
          let e2 = faceIndices[i===2?0:(i+1)]; //idx
          let u2 = projectedVertices[ e2 ].u;
          let v2 = rows - projectedVertices[ e2 ].v;
          makePixelatedLine(u1, v1, u2, v2, "#222222");
        }
      }

      for(let e = 0; e < sortedFaces.length; e++){
        let faceIndices = sortedFaces[e].indices;
        let faceColor = sortedFaces[e].color;

        let p0 = projectedVertices[faceIndices[0]];
        let p1 = projectedVertices[faceIndices[1]];
        let p2 = projectedVertices[faceIndices[2]];

        let y0 = rows - p0.v, y1 = rows - p1.v, y2 = rows - p2.v;

        // Find the min and max X/Y for this specific triangle
        let minX = Math.max(0, Math.floor(Math.min(p0.u, p1.u, p2.u)));
        let maxX = Math.min(cols - 1, Math.ceil(Math.max(p0.u, p1.u, p2.u)));
        let minY = Math.max(0, Math.floor(Math.min(y0, y1, y2)));
        let maxY = Math.min(rows - 1, Math.ceil(Math.max(y0, y1, y2)));

        for(let u=minX; u<maxX; u++){
          for(let v=minY; v<maxY; v++){
            if(checkPixelInFace(u, v, faceIndices, projectedVertices)){
              setPixelColor(u, v, faceColor);
            }
          }
        }
      }
    }
    else if(mode === "wireframe"){
      for(let e = 0; e < edges.length; e++){
        //first vertex
        let e1 = edges[e][0]; //idx
        let u1 = projectedVertices[ e1 ].u; 
        let v1 = rows - projectedVertices[ e1 ].v;  //TO DO- explain why did I do this? 
        // Because the canvas coordinate system has the origin(0,0) at the top-left corner

        //second vertex
        let e2 = edges[e][1]; //idx
        let u2 = projectedVertices[ e2 ].u;
        let v2 = rows - projectedVertices[ e2 ].v;  //TO DO- explain why did I do this?
        // Because the canvas coordinate system has the origin(0,0) at the top-left corner

        makePixelatedLine(u1, v1, u2, v2, "#00FF00");
      }
      
    }
  }

  function checkPixelInFace(u, v, face, projectedVertices) {
    let p0 = projectedVertices[face[0]];
    let p1 = projectedVertices[face[1]];
    let p2 = projectedVertices[face[2]];

    // Convert to 2D coordinates
    let A = { x: p0.u, y: rows - p0.v };
    let B = { x: p1.u, y: rows - p1.v };
    let C = { x: p2.u, y: rows - p2.v };

    // Barycentric coordinates
    let areaABC = Math.abs((A.x*(B.y-C.y) + B.x*(C.y-A.y) + C.x*(A.y-B.y)) / 2.0);
    let areaPAB = Math.abs((u*(A.y-B.y) + A.x*(B.y-v) + B.x*(v-A.y)) / 2.0);
    let areaPAC = Math.abs((u*(A.y-C.y) + A.x*(C.y-v) + C.x*(v-A.y)) / 2.0);
    let areaPBC = Math.abs((u*(B.y-C.y) + B.x*(C.y-v) + C.x*(v-B.y)) / 2.0);

    let sum = areaPAB + areaPAC + areaPBC;
    let tolerance = 0.01;
    let isInside = Math.abs(areaABC - sum) < tolerance;
    return isInside;
  }

  function calcDepthDiff(faces, projectedVertices) {
    let depthA = (projectedVertices[faces[0].indices[0]].z + projectedVertices[faces[0].indices[1]].z + projectedVertices[faces[0].indices[2]].z) / 3;
    let depthB = (projectedVertices[faces[1].indices[0]].z + projectedVertices[faces[1].indices[1]].z + projectedVertices[faces[1].indices[2]].z) / 3;
    return depthB - depthA;
  }
  function drawStaticObjects() {
    // Draw the static ship frame with direct canvas coordinates
    let c = "#FFFFFF"; // White color for the HUD

    // Draw the static ship frame onto the pixel grid
    makePixelatedLine(1.5 * cols / 4, 2 * rows / 4, 2.5 * cols / 4, 2 * rows / 4, c); // Top edge
    makePixelatedLine(1.5 * cols / 4, 2 * rows / 4, 1.5 * cols / 4, 3 * rows / 4, c); // Left edge
    makePixelatedLine(2.5 * cols / 4, 2 * rows / 4, 2.5 * cols / 4, 3 * rows / 4, c); // Right edge
    makePixelatedLine(1.5 * cols / 4, 3 * rows / 4, 2.5 * cols / 4, 3 * rows / 4, c); // Bottom edge

    makePixelatedLine(0, 1.5 * rows / 4, 1.5 * cols / 4, 2 * rows / 4, c); // Top Left diagonal
    makePixelatedLine(cols, 1.5 * rows / 4, 2.5 * cols / 4, 2 * rows / 4, c); // Top Right diagonal
    makePixelatedLine(1.5 * cols / 4, 3 * rows / 4, 0, 3.5 * rows / 4, c); // Bottom Left diagonal
    makePixelatedLine(2.5 * cols / 4, 3 * rows / 4, cols, 3.5 * rows / 4, c); // Bottom Right diagonal

    // Create the target square in the center of the ship frame
    makePixelatedLine(1.9 * cols / 4, 2.6 * rows / 4, 2.1 * cols / 4, 2.6 * rows / 4, c); // Top edge
    makePixelatedLine(1.9 * cols / 4, 2.6 * rows / 4, 1.9 * cols / 4, 2.4 * rows / 4, c); // Left edge
    makePixelatedLine(2.1 * cols / 4, 2.4 * rows / 4, 2.1 * cols / 4, 2.6 * rows / 4, c); // Right edge
    makePixelatedLine(1.9 * cols / 4, 2.4 * rows / 4, 2.1 * cols / 4, 2.4 * rows / 4, c); // Bottom edge

  }

  //This uses a built in 'drawLine' function, provided by the javascript canvas
  function drawLine(x1, y1, x2, y2){
    ctx.lineWidth = 2;
    ctx.strokeStyle = "white";

    //this is how you draw a line on the canvas 
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }


  //this is how we detect events-

              star.x = Math.random() * cols; // Randomize x position
            }
          }
          console.log("Down arrow pressed");
          moveHazard();
          drawAllObjects(hazardLs, camera);
          moveCount+=1;
          break;
        case "ArrowLeft":
          camera.x -= 1;
          for (let star of stars) {
            star.x -= 1; // Move stars right when the camera moves left
            if (star.x < 0) {
              star.x = cols; // Reset star to the right if it goes off the left
              star.y = Math.random() * rows; // Randomize y position
            }
          }
          console.log("Left arrow pressed");
          moveHazard();
          drawAllObjects(hazardLs, camera);
          moveCount+=1;
          break;
        case "ArrowRight":
          camera.x += 1;
          for (let star of stars) {
            star.x += 1; // Move stars left when the camera moves right
            if (star.x > cols) {
              star.x = 0; // Reset star to the left if it goes off the right
              star.y = Math.random() * rows; // Randomize y position
            }
          }
          console.log("Right arrow pressed");
          moveHazard();
          drawAllObjects(hazardLs, camera);
          moveCount+=1;
          break;
        case "KeyR":
          //****TO DO: reset camera
          camera.x = 0;

          drawAllObjects(hazardLs, camera);
          break;
        case "Space": 
          console.log("Spacebar pressed");
          // Check if any object is targeted
          for (let i = 0; i < hazardLs.length; i++) {

              console.log("Object Destroyed!");
              // Remove the targeted object from the hazardLs array
              hazardLs.splice(i, 1);

              updateHUD(); // Update the HUD with the new score
            }

          moveHazard();

          break;

        case "KeyF":
          if (mode === "rasterized") {

            mode = "rasterized";
          }
          console.log("Mode switched to:", mode);
          drawAllObjects(hazardLs, camera);
          break;

        default:
          return; 
      
      }
    }else{
      console.log("works");

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    drawAllObjects(hazardLs, camera);
  }

  function createCube(origin) {

    let cubeVertices = [ 
    { x:  1,  y: 1,  z: 1},   // A, idx 0
    { x: -1,  y: 1,  z: 1},   // B, idx 1
    { x:  1,  y: -1, z: 1},   // C, idx 2
    { x: -1,  y: -1, z:  1},  // D, idx 3
    { x:  1,  y: 1,  z: -1},  // E, idx 4
    { x: -1,  y: 1,  z: -1},  // F, idx 5
    { x:  1,  y: -1, z:  -1}, // G, idx 6
    { x: -1,  y: -1, z: -1}   // H, idx 7
  ];
  
  let cubeEdges = [
    [0, 1], // AB
    [0, 2], // AC
    [0, 4], // AE
    [1, 3], // BD
    [1, 5], // BF
    [2, 3], // CD
    [2, 6], // CG
    [3, 7], // DH
    [4, 5], // EF
    [4, 6], // EG
    [5, 7], // FH
    [6, 7]  // GH
  ];
  // an array of the indics for the two vertices in each edge
  let cubeFaces = [
  // Front face (A,B,D,C)
  { indices: [0, 1, 3], color: "#00FF00"}, // ABD
  { indices: [0, 3, 2], color: "#00FF00"}, // ADC

  // Back face (E,F,H,G)
  { indices: [4, 5, 7], color: "#FF0000"}, // EFH
  { indices: [4, 7, 6], color: "#FF0000"}, // EHG

  // Left face (A,C,G,E)
  { indices: [0, 2, 6], color: "#0000FF"}, // ACG
  { indices: [0, 6, 4], color: "#0000FF"}, // AGE

  // Right face (B,D,H,F)
  { indices: [1, 3, 7], color: "#FFFF00"}, // BDH
  { indices: [1, 7, 5], color: "#FFFF00"}, // BHF

  // Top face (A,B,F,E)
  { indices: [0, 1, 5], color: "#FF00FF"}, // ABF
  { indices: [0, 5, 4], color: "#FF00FF"}, // AFE

  // Bottom face (C,D,H,G)
  { indices: [2, 3, 7], color: "#00FFFF"}, // CDH
  { indices: [2, 7, 6], color: "#00FFFF"}, // CHG
];

  for (let i = 0; i < cubeVertices.length; i++) {
    cubeVertices[i].x += origin.x;
    cubeVertices[i].y += origin.y;
    cubeVertices[i].z += origin.z;
  }

  return {cubeVertices, cubeEdges, cubeFaces};
  }

  function createDiamond(origin) {
    let diamondVertices = [
      { x:  0,  y:  1.5, z:  0 }, // 0: Top Peak
      { x:  0,  y: -1.5, z:  0 }, // 1: Bottom Peak
      { x:  1,  y:  0,   z:  1 }, // 2: Equator Front-Right
      { x: -1,  y:  0,   z:  1 }, // 3: Equator Front-Left
      { x: -1,  y:  0,   z: -1 }, // 4: Equator Back-Left
      { x:  1,  y:  0,   z: -1 }  // 5: Equator Back-Right
    ];

    let diamondEdges = [
      // Top half edges
      [0, 2], [0, 3], [0, 4], [0, 5],
      // Bottom half edges
      [1, 2], [1, 3], [1, 4], [1, 5],
      // Equator edges
      [2, 3], [3, 4], [4, 5], [5, 2]
    ];

    let diamondFaces = [
      // Top half faces
      { indices: [0, 2, 3], color: "#FF0000" }, // Front (Red)
      { indices: [0, 3, 4], color: "#00FF00" }, // Left (Green)
      { indices: [0, 4, 5], color: "#0055FF" }, // Back (Blue)
      { indices: [0, 5, 2], color: "#FFFF00" }, // Right (Yellow)

      // Bottom half faces
      { indices: [1, 2, 3], color: "#FF8800" }, // Bottom-Front (Orange)
      { indices: [1, 3, 4], color: "#00FFFF" }, // Bottom-Left (Cyan)
      { indices: [1, 4, 5], color: "#FF00FF" }, // Bottom-Back (Magenta)
      { indices: [1, 5, 2], color: "#FFFFFF" }  // Bottom-Right (White)
    ];

    // Shift the diamond to the requested origin point
    for (let i = 0; i < diamondVertices.length; i++) {
      diamondVertices[i].x += origin.x;
      diamondVertices[i].y += origin.y;
      diamondVertices[i].z += origin.z;
    }

    return { 
      vertices: diamondVertices, 
      edges: diamondEdges, 
      faces: diamondFaces 
    };
  }
  function isObjectTargeted(object, camera) {
    let minU = Infinity, maxU = -Infinity, minV = Infinity, maxV = -Infinity;
    for (let v of object.vertices) {
      let camCoords = {
        x: v.x - camera.x,
        y: v.y - camera.y,
        z: v.z - camera.z
      };

      let projected = {
        u: camCoords.x / camCoords.z,
        v: camCoords.y / camCoords.z
      };

      projected.u = projected.u * cols + cols / 2;
      projected.v = projected.v * rows + rows / 2;
      projected.v = rows - projected.v; // Invert v for canvas coordinates

      minU = Math.min(minU, projected.u);
      maxU = Math.max(maxU, projected.u);
      minV = Math.min(minV, projected.v);
      maxV = Math.max(maxV, projected.v);
    }

    // Check if the projected coordinates are within the target square
    let targetLeft = 1.9 * cols/ 4;
    let targetRight = 2.1 * cols / 4;
    let targetTop = 2.6 * rows / 4;
    let targetBottom = 2.4 * rows / 4;

    console.log("Target square boundaries:", {
      left: targetLeft,
      right: targetRight,
      top: targetTop,
      bottom: targetBottom
    });

    console.log("Object boundaries:", {
      minU: minU,
      maxU: maxU,
      minV: minV,
      maxV: maxV
    });

    let isOutside = (
      maxU < targetLeft ||   // Object is entirely to the left
      minU > targetRight ||  // Object is entirely to the right
      maxV < targetBottom || // Object is entirely above
      minV > targetTop       // Object is entirely below
    );

    return !isOutside; // Return true if the object is within the target square

  }

  function updateHUD() {
    const infoDiv = document.getElementById("info");
    infoDiv.innerHTML = `<b>Projection</b><br>Score: ${score}`;
  }

  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
  updateHUD(); 


</script>
